name: Build Fedora ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged

    steps:
      - name: Install build tools & git
        run: |
          dnf install -y git lorax wget

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run ISO build script
        env:
          OS_VERSION_NUMBER: 44
          BUILD_DIR: ${{ github.workspace }}
        run: |
          chmod +x ./scripts/build_iso.sh
          ./scripts/build_iso.sh $OS_VERSION_NUMBER "$BUILD_DIR"

      - name: Calculate Next Version Tag
        id: tag_version
        run: |
          git config --global --add safe.directory '*'
          
          git fetch --tags --force
          
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.1"
          fi
          
          VERSION_NO_V="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION_NO_V" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NO_V" | cut -d. -f2)
          
          NEXT_MINOR=$((MINOR + 1))
          NEXT_TAG="v${MAJOR}.${NEXT_MINOR}"
          
          echo "NEW_TAG=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $NEXT_TAG"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-fantasy-hwqual.iso
          path: |
            *.iso
            **/*.iso
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.NEW_TAG }}
          name: Release ${{ steps.tag_version.outputs.NEW_TAG }}
          files: |
            *.iso
            **/*.iso
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}