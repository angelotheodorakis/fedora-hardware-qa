name: Build Fedora ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y lorax

      - name: Run ISO build script
        run: |
          chmod +x ./scripts/build_iso.sh
          ./scripts/build_iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-custom-iso
          path: |
            *.iso
            **/*.iso
          if-no-files-found: error
